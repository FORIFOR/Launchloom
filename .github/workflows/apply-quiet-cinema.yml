name: Apply Quiet Cinema homepage
on:
  push:
    branches: [fix/complete-production-journey-20260916]
    paths:
      - scripts/apply-quiet-cinema-homepage.py
      - .github/workflows/apply-quiet-cinema.yml
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'FORIFOR/Launchloom'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/apply-quiet-cinema-homepage.py
      - name: Commit generated homepage source
        run: |
          git add -- homepage/index.html homepage/ja/index.html
          git diff --cached --exit-code && exit 0
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'design: apply Quiet Cinema to public homepages'
          git push origin HEAD:fix/complete-production-journey-20260916
