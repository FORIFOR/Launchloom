name: Production journey
on:
  pull_request:
    paths: ['launchloom/**', 'tests/**', 'homepage/**', '.github/workflows/production-journey.yml']
  push:
    branches: ['fix/complete-production-journey-20260916']
permissions:
  contents: read
concurrency:
  group: production-journey-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source for reproducible local verification
        run: git archive --format=tar HEAD > source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: production-source-${{ github.sha }}
          path: source.tar
          retention-days: 1
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - run: python -m pip install -e '.[dev]'
      - run: python -m compileall -q launchloom
      - name: Check every application JavaScript module
        run: find launchloom/web -name '*.js' -print -exec node --check {} \;
      - run: python -m pytest -q
