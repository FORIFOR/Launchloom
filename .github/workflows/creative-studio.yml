name: Creative studio browser journey
on:
  pull_request:
    paths:
      - 'launchloom/creative*.py'
      - 'launchloom/production_api.py'
      - 'launchloom/web/creative-*'
      - 'tests/*creative*'
      - '.github/workflows/creative-studio.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - run: python -m pip install -e '.[dev]'
      - run: python -m playwright install --with-deps chromium
      - run: node --check launchloom/web/creative-studio.js && node --check launchloom/web/creative-entry.js
      - run: python tests/creative_browser_journey.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: creative-studio-browser
          path: creative-browser-artifacts/
