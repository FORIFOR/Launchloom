name: Apply browser journey ordering fix
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.pull_request.head.ref == 'feat/production-execution-20260917'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/production-execution-20260917
          fetch-depth: 0
      - name: Correct browser-test ordering
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/browser_journey.py')
          text=p.read_text()
          before='''                    page.locator('#execution-root .execution-panel').wait_for()\n                    assert page.get_by_role('button',name='Seedanceで生成').is_disabled()\n                    assert page.get_by_role('button',name='JSXを改善').is_disabled()\n                    assert page.get_by_role('button',name='AEPを作成').is_disabled()\n                    assert page.get_by_role('button',name='aerender → 完成版').is_disabled()\n                    page.locator('#title').fill('Launchloom — 制作から公開前確認まで')\n                    page.locator('#save').click()\n                    page.wait_for_function("() => document.querySelector('#save-state').textContent.includes('保存済み')")\n'''
          after='''                    assert '構成を保存すると' in page.locator('#execution-root').inner_text()\n                    page.locator('#title').fill('Launchloom — 制作から公開前確認まで')\n                    page.locator('#save').click()\n                    page.wait_for_function("() => document.querySelector('#save-state').textContent.includes('保存済み')")\n                    page.locator('#execution-root .execution-panel').wait_for()\n                    assert page.get_by_role('button',name='Seedanceで生成').is_disabled()\n                    assert page.get_by_role('button',name='JSXを改善').is_disabled()\n                    assert page.get_by_role('button',name='AEPを作成').is_disabled()\n                    assert page.get_by_role('button',name='aerender → 完成版').is_disabled()\n'''
          if before not in text: raise SystemExit('expected browser block not found')
          p.write_text(text.replace(before,after,1))
          PY
          rm .browser-test-order.patch .github/workflows/apply-browser-test-order-fix.yml
      - name: Commit clean correction
        run: |
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'test: check production execution after plan save'
          git push origin HEAD:feat/production-execution-20260917
