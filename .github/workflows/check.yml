name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  review-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked public source only
        run: git archive --format=zip --output=launchloom-review-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: review-source
          path: launchloom-review-source.zip
          retention-days: 1
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - run: python -m pip install -e '.[dev]'
      - run: python -m compileall -q launchloom
      - run: for script in launchloom/web/*.js; do node --check "$script"; done
      - run: python -m pytest -q
