name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  review-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked public source only
        run: git archive --format=zip --output=launchloom-review-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: review-source
          path: launchloom-review-source.zip
          retention-days: 1
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - run: python -m pip install -e '.[dev]'
      - run: python -m compileall -q launchloom
      - run: for script in launchloom/web/*.js; do node --check "$script"; done
      - run: python -m pytest -q

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - run: python -m pip install -e '.[dev]'
      - run: python -m playwright install --with-deps chromium
      - name: Exercise real studio with all external providers disabled
        run: python tests/browser_flow.py --output browser-evidence --record
      - name: Build bilingual site with the successful UI recording
        run: python -m homepage.build_site --recording browser-evidence --output site-ready
      - name: Check both pages, local links, playback and mobile layout
        run: python -m homepage.check_release --site site-ready --evidence browser-evidence
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-site
          path: site-ready
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: browser-evidence
          retention-days: 3

  publish-site:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    concurrency:
      group: launchloom-public-site
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - uses: actions/download-artifact@v4
        with:
          name: reviewed-site
          path: site-next
      - name: Copy only the reviewed site files; retain existing video and kit assets
        run: |
          for file in index.html ja/index.html site.css workflow.mp4 workflow-poster.jpg workflow-ja.vtt workflow-en.vtt production-sample.zip post-drafts.json workflow-verification.json; do
            test -f "site-next/$file"
            cp "site-next/$file" "$file"
            git add -- "$file"
          done
      - name: Commit verified homepage
        id: commit
        run: |
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Publish verified workflow from ${GITHUB_SHA}"
          git push origin HEAD:gh-pages
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Request Pages rebuild
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" --jq '{status:.status,url:.url}'
