name: Apply production execution patch
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.pull_request.head.ref == 'feat/production-execution-20260917'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/production-execution-20260917
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply transferred text patch and update contracts
        run: |
          cat .launchloom-patch/part-* > /tmp/production-execution.patch
          python - <<'PY'
          from pathlib import Path
          patch=Path('/tmp/production-execution.patch')
          text=patch.read_text()
          marker='diff --git a/homepage/production-sample.zip b/homepage/production-sample.zip'
          start=text.find(marker)
          if start >= 0:
              nxt=text.find('\ndiff --git ', start+len(marker))
              text=text[:start] + (text[nxt+1:] if nxt >= 0 else '')
          patch.write_text(text)

          replacements={
            'tests/test_horio_premium_homepage.py': [
              ("assert 'Seedance専用API・エージェント自動実行</td><td>未実装' in ja", "assert 'Seedance 2.5・コーディングエージェント実行' in ja and '明示実行を実装' in ja"),
              ("assert 'Dedicated Seedance API + automatic agent execution</td><td>Not implemented' in en", "assert 'Seedance 2.5 + coding-agent execution' in en and 'Opt-in implementation' in en"),
            ],
            'tests/test_production_homepage.py': [
              ("assert 'Seedance専用API・エージェント自動実行</td><td>未実装' in text", "assert 'Seedance 2.5・コーディングエージェント実行' in text and '明示実行を実装' in text"),
              ("assert 'Execution boundary:' in en and 'remain manual' in en", "assert 'Execution boundary:' in en and 'explicit opt-in actions' in en"),
            ],
            'tests/test_quiet_cinema.py': [
              ("assert 'Seedance専用API・エージェント自動実行' in ja\n    assert '未実装' in ja", "assert 'Seedance 2.5・コーディングエージェント実行' in ja\n    assert '明示実行を実装' in ja"),
            ],
          }
          for name, pairs in replacements.items():
              path=Path(name); value=path.read_text()
              for old,new in pairs:
                  if old not in value: raise SystemExit(f'missing expected test contract in {name}: {old}')
                  value=value.replace(old,new)
              path.write_text(value)
          PY
          git apply --check /tmp/production-execution.patch
          git apply /tmp/production-execution.patch
          rm -rf .launchloom-patch .github/workflows/apply-production-execution.yml
      - name: Validate implementation
        run: |
          sudo apt-get update >/dev/null && sudo apt-get install -y ffmpeg fonts-noto-cjk >/dev/null
          python -m pip install -e '.[dev]' >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          from launchloom.production import build_bundle
          plan={
            'schema_version':1,'title':'Launchloom sample','aspect_ratio':'16:9','fps':30,
            'scenes':[
              {'id':'opening','source':'seedance','title':'A real product, clearly presented.','prompt':'製品の雰囲気を伝える映像。実際の操作映像や実装の証拠として扱わない。','seconds':4},
              {'id':'product','source':'recording','title':'実際の操作画面 / Product recording','prompt':'許可のある操作録画を使い、機密情報を除く。','seconds':16},
              {'id':'closing','source':'after_effects','title':'Launchloom sample','prompt':'読みやすい文字と控えめなフェード。','seconds':4},
            ]}
          Path('homepage/production-sample.zip').write_bytes(build_bundle(plan))
          PY
          python -m compileall -q launchloom
          for file in launchloom/web/*.js; do node --check "$file"; done
          python -m pytest -q
      - name: Commit clean implementation
        run: |
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: add guarded production execution'
          git push origin HEAD:feat/production-execution-20260917
