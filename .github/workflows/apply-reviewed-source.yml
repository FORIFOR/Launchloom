name: Apply reviewed production source once
on:
  push:
    branches: [feat/production-to-publish-20260916]
    paths: ['.github/changesets/reviewed-source-*.b85', '.github/workflows/apply-reviewed-source.yml']
permissions:
  contents: write
concurrency:
  group: launchloom-reviewed-source-once
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'FORIFOR/Launchloom' && github.ref == 'refs/heads/feat/production-to-publish-20260916'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/production-to-publish-20260916
          fetch-depth: 0
      - name: Verify and apply the exact locally reviewed file edits
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, pathlib, subprocess
          # Transport only: no eval, installs, provider calls, tests or deployment
          # in this write-enabled job. All 34 before/after blobs are verified.
          allowed = set('''.env.example
          .github/workflows/check.yml
          .github/workflows/publish-post-samples.yml
          README.ja.md
          README.md
          docs/PRODUCTION_HANDOFF.md
          docs/PRODUCTION_WORKFLOW.md
          homepage/build_site.py
          homepage/check_release.py
          homepage/index.html
          homepage/ja/index.html
          homepage/post-drafts.json
          homepage/production-sample.zip
          homepage/site.css
          launchloom/cli.py
          launchloom/final_media.py
          launchloom/models.py
          launchloom/motion_runner.py
          launchloom/production.py
          launchloom/production_api.py
          launchloom/scene_jobs.py
          launchloom/server.py
          launchloom/web/app.css
          launchloom/web/app.js
          launchloom/web/i18n.js
          launchloom/web/index.html
          launchloom/web/production.css
          launchloom/web/production.html
          launchloom/web/production.js
          tests/browser_flow.py
          tests/test_final_media_flow.py
          tests/test_motion_runner.py
          tests/test_production_homepage.py
          tests/test_scene_jobs.py'''.splitlines())
          parts = [pathlib.Path(f'.github/changesets/reviewed-source-{i:03}.b85') for i in range(4)]
          packed = base64.b85decode(b''.join(p.read_bytes() for p in parts))
          decoder = lzma.LZMADecompressor()
          raw = decoder.decompress(packed, max_length=1000000)
          assert decoder.eof and not decoder.unused_data, 'Invalid or oversized archive'
          assert hashlib.sha256(raw).hexdigest() == '334d0b5493d4cb3c2a6086948651935cbb260de873f7075ec8ea7164a6fc7e8b', 'Transport hash mismatch'
          edits = json.loads(raw)
          assert len(edits) == len(allowed) and {e['path'] for e in edits} == allowed, 'Unexpected paths'
          def blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          prepared = []
          for item in edits:
              path = pathlib.Path(item['path'])
              assert not path.is_symlink() and not any(p.is_symlink() for p in path.parents)
              if item['before'] is None:
                  assert not path.exists(), f'New path already exists: {path}'
                  old = b''
              else:
                  old = path.read_bytes()
                  assert blob(old) == item['before'], f'Concurrent source change: {path}'
              if 'text' in item:
                  new = item['text'].encode('utf-8')
              elif 'base64' in item:
                  new = base64.b64decode(item['base64'], validate=True)
              else:
                  lines = old.decode('utf-8').splitlines(keepends=True)
                  for start, end, replacement in reversed(item['edits']):
                      assert type(start) is int and type(end) is int and 0 <= start <= end <= len(lines)
                      lines[start:end] = replacement.splitlines(keepends=True)
                  new = ''.join(lines).encode('utf-8')
              assert blob(new) == item['after'], f'Result hash mismatch: {path}'
              prepared.append((path, new))
          # No source is changed until every path and resulting blob passes.
          for path, data in prepared:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
              print('Verified source:', path, blob(data))
          subprocess.run(['git', 'add', '--', *sorted(allowed)], check=True)
          subprocess.run(['git', 'rm', '--', '.github/workflows/apply-reviewed-source.yml', *map(str, parts)], check=True)
          PY
      - name: Commit only to the improvement branch, without force
        run: |
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "feat: connect production, immutable final media and reviewed publishing; unify bilingual site"
          git push origin HEAD:refs/heads/feat/production-to-publish-20260916
