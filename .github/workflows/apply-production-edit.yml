name: Apply verified production upgrade
on:
  push:
    branches: [fix/complete-production-journey-20260916]
    paths: ['.github/production-edits/**', '.github/workflows/apply-production-edit.yml']
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'FORIFOR/Launchloom' && github.ref == 'refs/heads/fix/complete-production-journey-20260916'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply hash-verified, locally tested source edits on the feature branch only
        shell: python
        run: |
          import base64, hashlib, json, lzma, shutil
          from pathlib import Path
          chunks = sorted(Path('.github/production-edits').glob('part-*.b64'))
          assert len(chunks) == 5
          raw = lzma.decompress(base64.b64decode(''.join(p.read_text().strip() for p in chunks), validate=True))
          assert hashlib.sha256(raw).hexdigest() == '4055f70cd3cb8298917ceba07812af1235a495d2e641534d89acd092159fe066'
          operations = json.loads(raw)
          prepared = []
          root = Path.cwd().resolve()
          for op in operations:
              path = Path(op['path'])
              assert not path.is_absolute() and '..' not in path.parts and path.parts[0] in ('launchloom','tests','homepage','docs','.github','README.md','README.ja.md')
              assert not path.is_symlink() and path.resolve().is_relative_to(root)
              if 'sha256' in op:
                  source = path.read_bytes()
                  assert hashlib.sha256(source).hexdigest() == op['sha256'], str(path)
                  content = source.decode('utf-8')
                  for edit in reversed(op['changes']):
                      assert 0 <= edit['start'] <= edit['end'] <= len(content)
                      content = content[:edit['start']] + edit['text'] + content[edit['end']:]
              else:
                  assert not path.exists(), str(path)
                  content = op['content']
              prepared.append((path, content))
          for path, content in prepared:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content, encoding='utf-8')
          from launchloom.production import initial_plan, build_bundle
          Path('homepage/production-sample.zip').write_bytes(build_bundle(initial_plan({'name':'Launchloom sample','tagline':'A real product, clearly presented.','features':[]})))
          shutil.rmtree('.github/production-edits')
          Path('.github/workflows/apply-production-edit.yml').unlink()
      - name: Commit only to the requested feature branch
        run: |
          test "$GITHUB_REF" = refs/heads/fix/complete-production-journey-20260916
          git add -- launchloom tests homepage docs README.md README.ja.md .github
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: connect scene planning, immutable final-film import and approved publishing'
          git push origin HEAD:fix/complete-production-journey-20260916
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - run: python -m pip install -e '.[dev]'
      - run: python -m compileall -q launchloom
      - run: for file in launchloom/web/*.js; do node --check "$file"; done
      - run: python -m pytest -q
      - run: python -m playwright install --with-deps chromium
      - name: Run the real studio browser journey
        env:
          LAUNCHLOOM_BROWSER_ARTIFACTS: browser-artifacts
        run: python tests/browser_journey.py
      - name: Retain browser evidence and reproducible source
        if: always()
        run: git archive --format=tar HEAD > source.tar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-upgrade-verification
          path: |
            browser-artifacts
            source.tar
          retention-days: 2
