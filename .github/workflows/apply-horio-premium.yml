name: Apply Horio Premium Web
on:
  push:
    branches: [fix/complete-production-journey-20260916]
    paths:
      - '.github/hpw-payload.b64'
      - '.github/workflows/apply-horio-premium.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply staged homepage edits only if expected source is unchanged
        shell: python
        run: |
          import base64, json, lzma, subprocess
          from pathlib import Path
          expected = {
              'homepage/ja/index.html': '1ba421c5f58651b9deb6dc8b3daa34ac7e5bb4eb',
              'homepage/index.html': 'c6c6695ccf31a146afd49735747442bf7f26ab75',
              'homepage/check.py': '9825fc6139bb5215733306a5de2f27d9d6d459d8',
          }
          for path, blob in expected.items():
              actual = subprocess.check_output(['git','hash-object',path], text=True).strip()
              assert actual == blob, f'{path} changed concurrently: {actual}'
          for path in ['homepage/horio-premium.css','homepage/horio-premium.js','tests/test_horio_premium_homepage.py','docs/HORIO_PREMIUM_WEB.md']:
              assert not Path(path).exists(), f'{path} already exists; refusing to overwrite'
          encoded = Path('.github/hpw-payload.b64').read_text().strip()
          operations = json.loads(lzma.decompress(base64.b64decode(encoded)).decode())
          allowed = ('homepage/', 'tests/', 'docs/')
          for op in operations:
              path = Path(op['path'])
              assert not path.is_absolute() and '..' not in path.parts and str(path).startswith(allowed)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(op['content'], encoding='utf-8')
      - name: Verify static homepage contracts
        run: |
          python -m pip install pytest
          python -m py_compile homepage/check.py
          python -m pytest -q tests/test_horio_premium_homepage.py tests/test_production_homepage.py
      - name: Commit verified application files
        run: |
          git add -- homepage/ja/index.html homepage/index.html homepage/check.py homepage/horio-premium.css homepage/horio-premium.js tests/test_horio_premium_homepage.py docs/HORIO_PREMIUM_WEB.md
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'design: apply Horio Premium Web to Launchloom homepage'
          git push origin HEAD:fix/complete-production-journey-20260916
