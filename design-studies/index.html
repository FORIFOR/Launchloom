<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Reachmadeの6製品のUI設計プレビュー。サンプルデータによる提案画面であり、公開済み製品の実演ではありません。"><title>Reachmade — UI design previews</title><style>
:root{--ink:#1d2523;--muted:#6b736f;--paper:#f6f5f1;--line:#dadfd8;--accent:#315c48;--wash:#eaf1e9}*{box-sizing:border-box}body{margin:0;background:var(--paper);font-family:-apple-system,BlinkMacSystemFont,'Noto Sans CJK JP','Hiragino Kaku Gothic ProN',sans-serif;color:var(--ink)}button,select{font:inherit}button{cursor:pointer}.canvas{width:1440px;height:810px;transform-origin:0 0;position:relative;overflow:hidden;padding:40px 64px;background:var(--paper)}.mast{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:.12em}.mast strong{font-size:18px;letter-spacing:-.04em}.mast span{color:var(--muted)}.headline{margin-top:30px;display:flex;align-items:end;justify-content:space-between;gap:32px}.headline h1{font-size:42px;line-height:1.35;letter-spacing:-.055em;font-weight:600;margin:0}.headline p{font-size:15px;line-height:1.85;margin:0;max-width:430px;color:var(--muted)}.app{height:478px;border:1px solid var(--line);border-radius:14px;background:#fff;margin-top:30px;box-shadow:0 22px 60px -40px #24342655;overflow:hidden;transform-origin:50% 50%}.bar{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--line);font-size:13px}.wordmark{font-size:17px;font-weight:600;letter-spacing:-.035em}.bar .sample{font-size:11px;color:var(--muted);border:1px solid var(--line);padding:4px 9px;border-radius:5px}.layout{display:grid;grid-template-columns:220px 1fr;height:calc(100% - 52px)}.side{background:#fafaf8;border-right:1px solid var(--line);padding:26px 20px}.side small{font-size:10px;color:var(--muted);letter-spacing:.1em}.side .nav{font-size:13px;padding:12px 14px;margin-top:14px;border-radius:6px}.side .nav.active{background:var(--wash);color:var(--accent);font-weight:600}.side .line{height:1px;background:var(--line);margin-top:24px}.side .tiny{font-size:12px;line-height:1.8;color:var(--muted);margin-top:18px}.body{padding:27px 34px;min-width:0}.body h2{font-size:24px;line-height:1.5;margin:0 0 6px;font-weight:600;letter-spacing:-.03em}.meta{font-size:12px;color:var(--muted);line-height:1.9}.two{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:22px}.panel{border:1px solid var(--line);border-radius:9px;padding:20px;min-width:0}.panel h3{font-size:13px;margin:0 0 16px;font-weight:500;color:var(--muted)}.quote{font-size:21px;line-height:1.85;letter-spacing:-.02em}.quote.small{font-size:17px}.pill{display:inline-block;padding:5px 10px;border-radius:5px;background:var(--wash);color:var(--accent);font-size:11px;line-height:1.5;font-weight:600}.pill.pending{color:#8b5b24;background:#faf0df}.pill.neutral{background:#f1f2ef;color:var(--muted)}.status{display:flex;gap:12px;align-items:center;margin-bottom:15px}.row{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:13px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.65}.row:last-child{border:0}.row small{font-size:11px;color:var(--muted)}.action{display:inline-flex;align-items:center;justify-content:center;padding:10px 18px;border-radius:6px;background:var(--accent);color:#fff;font-size:12px;line-height:1.8;margin-top:17px;pointer-events:none}.progress{height:3px;background:var(--line);position:absolute;bottom:0;left:0;right:0}.progress i{display:block;height:100%;background:var(--accent);width:0}.foot{margin-top:24px;display:flex;align-items:center;justify-content:space-between}.steps{display:flex;gap:22px;font-size:13px;color:#87918b}.steps span.current{color:var(--ink);font-weight:600}.notice{font-size:11px;color:var(--muted);line-height:1.7;text-align:right}.wave{height:85px;display:flex;align-items:center;justify-content:center;gap:5px;margin:6px 0 10px}.wave i{display:block;width:4px;border-radius:3px;background:var(--accent);height:15px}.file{padding:12px 15px;border:1px solid var(--line);border-radius:6px;font-size:12px;margin:9px 0;background:#fdfdfb}.diff{padding:11px 14px;background:#f8eeea;font-size:12px;line-height:1.8;border-left:3px solid #b87964;margin-top:10px}.diff.good{background:var(--wash);border-color:var(--accent)}.artifact{font-size:15px;line-height:2}.artifact b{font-weight:600}.outputgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:22px}.output{border:1px solid var(--line);border-radius:8px;padding:14px;font-size:12px;background:#fff}.tile{height:110px;background:var(--wash);border:1px solid #d5ddd3;display:flex;align-items:center;justify-content:center;position:relative;margin-bottom:14px;border-radius:5px}.tile .mini{background:#fff;width:88%;height:66%;border:1px solid var(--line);padding:12px}.tile .mini i{display:block;height:4px;background:#a4b49f;margin:6px 0}.tile.portrait .mini{width:38%;height:90%}.timeline{position:relative;border-left:1px solid var(--line);padding-left:18px;margin-left:7px}.event{padding:6px 0 18px;font-size:14px;line-height:1.7;position:relative}.event:before{content:'';width:7px;height:7px;border-radius:50%;background:var(--accent);position:absolute;left:-22px;top:13px}.event small{display:block;color:var(--muted);font-size:11px}.selector{position:fixed;left:20px;bottom:18px;z-index:5;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.selector select,.selector button,.selector a{background:#fff;border:1px solid #d7ddd5;border-radius:5px;padding:8px 12px;font-size:12px;min-height:40px}.render .selector{display:none}a{color:inherit}:focus-visible{outline:3px solid var(--accent);outline-offset:3px}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body><div class="canvas" id="canvas"><div class="mast"><strong>Reachmade<span style="font-weight:400;color:var(--muted)"> / Design studies</span></strong><span id="number"></span></div><div class="headline"><h1 id="title"></h1><p id="subtitle"></p></div><div class="app" id="app"><div class="bar"><span class="wordmark" id="brand"></span><span class="sample">UI DESIGN PREVIEW · サンプルデータ</span></div><div class="layout"><aside class="side"><small>WORKSPACE</small><div class="nav active" id="nav1"></div><div class="nav" id="nav2"></div><div class="nav" id="nav3"></div><div class="line"></div><p class="tiny">次期UIの設計プレビュー。<br>AI・外部サービスには<br>接続していません。</p></aside><section class="body" id="body"></section></div></div><div class="foot"><div class="steps" id="steps"></div><div class="notice">DESIGN PROTOTYPE — NOT A LIVE PRODUCT DEMO<br>画面・操作・結果は設計例です。実装済み機能の証明ではありません。</div></div><div class="progress"><i id="progress"></i></div></div><div class="selector"><select id="product" aria-label="Product"></select><button id="play" type="button">再生</button><button id="restart" type="button">最初から</button><a href="gallery.html">動画一覧</a><a href="https://reachmade.com/">Reachmade</a></div><script>
const DATA={
'genie':{name:'Genie',title:'依頼の先に、使える成果物。',sub:'考えを書く。結果を確かめる。依頼と成果物を、同じ場所に。',accent:'#426a5a',wash:'#eef3ed',nav:['ワークスペース','成果物','モデル設定'],steps:['01 依頼を書く','02 下書きを確認','03 ファイルとして使う']},
'ai-meeting':{name:'AI Meeting',title:'話したことを、次の行動に。',sub:'聞き取った変更をそのまま保存しない。確認してから、タスクへ。',accent:'#3e6769',wash:'#edf4f3',nav:['今日の会話','タスク','会話の設定'],steps:['01 話す','02 変更を確認','03 タスクを保存']},
'oathra':{name:'Oathra',title:'「できました」を、確かめる。',sub:'AIの自己申告ではなく、相手の言葉。確約されたことと、まだ不明なことを分ける。',accent:'#985331',wash:'#f7eee5',nav:['会話の検証','根拠の記録','入力形式'],steps:['01 発言を読む','02 条件と照合','03 確認できた範囲']},
'aisecure':{name:'AI Secure',title:'警告の列から、調べられる一件へ。',sub:'観測をつなげ、判断の材料をそろえる。事実・仮説・不明を、同じにしない。',accent:'#38654c',wash:'#eef4ed',nav:['調査ケース','観測イベント','入力の品質'],steps:['01 観測をたどる','02 関連性を確認','03 次の調査を決める']},
'agent-team':{name:'Agent Team',title:'作る。確かめる。受け取る。',sub:'Botの会話ではなく、できたファイルを主役に。レビューで何が変わったかも残す。',accent:'#4f5e80',wash:'#eff1f7',nav:['作業スペース','成果物','接続設定'],steps:['01 一度だけ依頼','02 作成とレビュー','03 ファイルを確認']},
'launchloom':{name:'Launchloom',title:'ひとつの素材から、公開の準備まで。',sub:'動画、ページ、投稿案。同じ企画を、それぞれの場所に合う形へ。',accent:'#775d40',wash:'#f4efe7',nav:['制作スタジオ','完成した素材','設定'],steps:['01 素材を選ぶ','02 構成を確認','03 公開素材を受け取る']}};
const pill=(t,k='')=>`<span class="pill ${k}">${t}</span>`;
const row=(a,b)=>`<div class="row"><span>${a}</span><span>${b}</span></div>`;
const panel=(h,c)=>`<div class="panel"><h3>${h}</h3>${c}</div>`;
function content(id,s){
 if(id==='genie')return `<h2>新しいサービスの公開準備</h2><div class="meta">ワークスペース / launch-plan.md　・　設計サンプル</div><div class="two">${panel('依頼',`<div class="quote small">このメモから、<br>来週やることを3つに整理。<br>そのまま使える計画書に。</div>${pill(s?'下書きあり':'作成する内容を確認','neutral')}`)}${panel(s===0?'受け取りたいもの':'成果物',s===0?`<div class="file">launch-plan.md</div><div class="meta">編集・コピー・保存を同じ場所で。</div>`:`<div class="artifact"><b>公開までの、3つのこと。</b><br>1. 最初に試してもらう体験を決める<br>2. 操作と結果を、短い実演で見せる<br>3. 使ってみた感想を受け取る</div>${s===2?'<span class="action">Markdownで保存</span>':''}`)}</div>`;
 if(id==='ai-meeting')return `<h2>${s===2?'確認したタスク':'今日の予定を、声で整理'}</h2><div class="meta">「提案」と「保存済み」を分けるUIの設計例</div><div class="two">${panel('会話',`<div class="wave">${Array.from({length:24},(_,i)=>`<i data-wave="${i}"></i>`).join('')}</div><div class="quote small">「資料確認は完了。<br>メールの返信は明日にして」</div>`)}${panel(s===2?'保存済み':'確認待ちの変更',s===0?`<div class="meta">聞き取った変更をここで確認します。<br>承認するまでは反映しません。</div>`:`${row('資料を確認する',pill('完了',s===1?'pending':''))}${row('メールを返信する',pill('明日に延期',s===1?'pending':''))}<div class="meta" style="margin-top:16px">${s===1?'まだ保存していません。':'サンプル状態：確認後の表示'}</div>${s===1?'<span class="action">この2件を反映</span>':''}`)}</div>`;
 if(id==='oathra')return `<h2>予約の確認</h2><div class="meta">会話上の確認 ≠ 店舗システムへの登録</div><div class="two">${panel('相手の発言',`<div class="quote">${s===0?'「確認して、<br>折り返します」':'「19時、2名様で<br>ご予約を承りました」'}</div><div class="meta" style="margin-top:17px">説明用の文字起こしサンプル</div>`)}${panel('判定と根拠',`${row('会話上の確約',pill(s===0?'未確定':'確認あり',s===0?'pending':''))}${row('日時・人数',s===0?'確認が必要':'19:00 / 2名')}${row('店舗の予約台帳',pill('未検証','neutral'))}<div class="meta" style="margin-top:13px">${s===2?'確認できた範囲を、根拠と一緒に残します。':'保留を、予約完了として扱いません。'}</div>`)}</div>`;
 if(id==='aisecure')return `<h2>${s===0?'3つの観測':'確認が必要なアクセス経路'}</h2><div class="meta">CASE-001　・　合成データによる画面設計</div><div class="two">${panel('時系列',`<div class="timeline"><div class="event">公開された接続機器<small>09:12 · gateway-01</small></div><div class="event">特権アカウントのログイン<small>09:18 · session-01</small></div><div class="event">短時間の大量ファイル参照<small>09:22 · 同じアカウント・セッション</small></div></div>`)}${panel('調査のための整理',s===0?`<div class="quote small">単独の警告ではなく、<br>関係をたどる。</div>`:`${row(pill('観測'),'3つの記録が関連')}${row(pill('仮説','pending'),'アカウント侵害の可能性')}${row(pill('不明','neutral'),'外部への漏えい')}<div class="meta" style="margin-top:16px">${s===2?'次に確認する記録を選ぶ。自動遮断はしません。':'仮説と事実は別々に表示します。'}</div>`)}</div>`;
 if(id==='agent-team')return `<h2>CSVを要約する、小さなツール</h2><div class="meta">説明用のワークフロー　・　AIは実行していません</div><div class="two">${panel(s?'成果物':'依頼',s?`<div class="file">summarize.py</div><div class="file">test_summary.py</div><div class="file">README.md</div>`:`<div class="quote small">CSVの売上を月ごとに集計。<br>空の入力も扱えるように。<br>テストと使い方も添えて。</div>`)}${panel(s===0?'完了条件':'レビューで変わったこと',s===0?`${row('集計処理','Python')}${row('検査','テスト')}${row('使い方','README')}`:`<div class="diff">変更前：空の入力でエラー</div><div class="diff good">変更後：空の入力を明示的に処理</div><div class="meta" style="margin-top:12px">実行結果・検査状態を、ファイルと並べて確認。</div>${s===2?'<span class="action">ファイルを確認</span>':''}`)}</div>`;
 return `<h2>${s===2?'受け取る素材を、選ぶ。':'この録画を、伝わる素材に。'}</h2><div class="meta">デザインプレビュー　・　実際の書き出し結果ではありません</div>${s===0?`<div class="two">${panel('入力素材','<div class="file">product-recording.mp4</div><div class="quote small" style="margin-top:18px">製品名・伝えたいこと・<br>使ってほしい人を、ひとつの企画に。</div>')}${panel('公開前に確認','<div class="artifact">画面で見せる機能<br>見出しと字幕<br>使う素材の権利</div>')}</div>`:`<div class="outputgrid">${['横動画','縦動画','紹介ページ','投稿案'].map((n,i)=>`<div class="output"><div class="tile ${i===1?'portrait':''}"><div class="mini"><i></i><i style="width:64%"></i><i></i></div></div><b>${n}</b><div class="meta">${['16:9','9:16','HTML','媒体別の下書き'][i]}</div></div>`).join('')}</div><div class="status" style="margin-top:20px">${pill(s===2?'確認して受け取る':'構成を確認中',s===1?'pending':'')}<span class="meta">外部への投稿は別の承認操作です。</span></div>`}`;
}
let chosen=new URLSearchParams(location.search).get('product')||'ai-meeting';if(!Object.hasOwn(DATA,chosen))chosen='ai-meeting';let time=0,lastScene=-1,playing=false,last=0;const DURATION=18;
const ids=Object.keys(DATA);const select=document.getElementById('product');ids.forEach(id=>{const o=document.createElement('option');o.value=id;o.textContent=DATA[id].name;select.append(o)});
function setup(id){if(!Object.hasOwn(DATA,id))throw Error('Unknown product');chosen=id;const d=DATA[id];document.documentElement.style.setProperty('--accent',d.accent);document.documentElement.style.setProperty('--wash',d.wash);document.getElementById('brand').textContent=d.name;document.getElementById('title').textContent=d.title;document.getElementById('subtitle').textContent=d.sub;document.getElementById('number').textContent=`${String(ids.indexOf(id)+1).padStart(2,'0')} / 06 — ${d.name.toUpperCase()}`;d.nav.forEach((n,i)=>document.getElementById('nav'+(i+1)).textContent=n);document.getElementById('steps').innerHTML=d.steps.map(t=>`<span>${t}</span>`).join('');select.value=id;lastScene=-1;seek(0)}
function seek(t){time=Math.max(0,Math.min(DURATION,t));const scene=Math.min(2,Math.floor(time/6));if(scene!==lastScene){document.getElementById('body').innerHTML=content(chosen,scene);lastScene=scene}const local=time-scene*6;const ease=1-Math.pow(1-Math.min(1,local/.65),3);document.getElementById('body').style.opacity=.3+.7*ease;document.getElementById('body').style.transform=`translateY(${8*(1-ease)}px)`;document.getElementById('app').style.transform=`scale(${.989+.011*Math.min(1,time/2)})`;document.querySelectorAll('#steps span').forEach((e,i)=>e.classList.toggle('current',scene===i));document.querySelectorAll('[data-wave]').forEach((e,i)=>e.style.height=(13+(1+Math.sin(time*4.8+i*.62))*18+9*Math.cos(i*.43))+'px');document.getElementById('progress').style.width=(time/DURATION*100)+'%'}
function fit(){const scale=Math.max(.1,Math.min(innerWidth/1440,(innerHeight-(document.body.classList.contains('render')?0:96))/810));document.getElementById('canvas').style.transform=`scale(${scale})`;document.getElementById('canvas').style.marginLeft=Math.max(0,(innerWidth-1440*scale)/2)+'px'}
window.motion={seek,setup,duration:DURATION};if(new URLSearchParams(location.search).has('render'))document.body.classList.add('render');setup(chosen);fit();addEventListener('resize',fit);select.onchange=()=>{playing=false;document.getElementById('play').textContent='再生';setup(select.value)};document.getElementById('play').onclick=()=>{playing=!playing;document.getElementById('play').textContent=playing?'一時停止':'再生';last=performance.now();if(time>=DURATION)seek(0)};document.getElementById('restart').onclick=()=>seek(0);function loop(now){if(playing){seek(time+(now-last)/1000);if(time>=DURATION){playing=false;document.getElementById('play').textContent='再生'}}last=now;requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
