services:
  studio:
    build: .
    ports:
      - "127.0.0.1:8787:8787"
    env_file:
      - .env
    environment:
      LAUNCHLOOM_HOST: 0.0.0.0
      LAUNCHLOOM_DATA: /data
    volumes:
      - studio-data:/data
    shm_size: 1gb
    init: true
    restart: unless-stopped
    # Chromium's own sandbox stays ON. Docker's default seccomp profile blocks the
    # user-namespace syscalls it needs, so a Chromium-aware profile is supplied
    # instead of disabling either boundary. Verify with: docker compose exec studio
    # python -m launchloom doctor  ->  "Browser launch: OK".
    security_opt:
      - seccomp=./docker/chromium-seccomp.json
volumes:
  studio-data:
